<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC HUB - Đăng Ký</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- THANH ĐIỀU HƯỚNG CHUNG -->
    <header>
        <div class="logo">FC HUB.</div>
        <nav>
            <a href="index.html">Trang Chủ</a>
            <a href="market.html">Thị Trường</a>
            <a href="shortlist.html">Theo Dõi</a>
            <a href="compare.html">So Sánh</a>
            <a href="news.html">Tin Tức</a>
            <a href="contact.html">Liên Hệ</a>
            <a href="about.html">Giới Thiệu</a>
        </nav>
    </header>

    <!-- NỘI DUNG ĐĂNG KÝ -->
    <main class="container" style="padding-top: 3rem;">
        <h1 style="text-align: center; margin-bottom: 2rem;">Tạo Tài Khoản Mới</h1>
        <div style="background: rgba(0,0,0,0.4); padding: 2.5rem; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); max-width: 450px; margin: 0 auto; backdrop-filter: blur(10px);">
            <form id="signup-form" onsubmit="handleSignup(event)">
                <div style="margin-bottom: 1.25rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Họ và tên:</label>
                    <input type="text" id="signup-name" placeholder="Nhập họ và tên..." required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #fff; outline: none;">
                </div>
                <div style="margin-bottom: 1.25rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Email:</label>
                    <input type="email" id="signup-email" placeholder="Nhập địa chỉ email..." required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #fff; outline: none;">
                </div>
                <div style="margin-bottom: 1.25rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Mật khẩu:</label>
                    <input type="password" id="signup-password" placeholder="Nhập mật khẩu..." required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #fff; outline: none;">
                </div>
                <div style="margin-bottom: 1.75rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Xác nhận mật khẩu:</label>
                    <input type="password" id="signup-confirm-password" placeholder="Nhập lại mật khẩu..." required style="width: 100%; padding: 0.75rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #fff; outline: none;">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-weight: bold; font-size: 1rem; margin-bottom: 1rem;">Đăng Ký</button>
                <p style="text-align: center; font-size: 0.95rem; color: rgba(255,255,255,0.7);">
                    Đã có tài khoản? <a href="login.html" style="color: var(--primary-color); text-decoration: underline; font-weight: 600;">Đăng nhập ngay</a>
                </p>
            </form>
        </div>
    </main>

    <!-- THÔNG BÁO TOAST & SCRIPT -->
    <div id="toast">Thông báo</div>
    <script src="app.js"></script>
</body>
</html>
